[workspace]
members = [
    "crates/docudis-core",
    "crates/docudis-capi",
    "crates/docudis-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stonetech-pxia/docudis-core"

[workspace.dependencies]
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
